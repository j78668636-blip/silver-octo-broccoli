name: Build Geode Mod
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: geode-sdk/build-geode-mod@main
      id: build
      with:
        sdk: v5.10.1
    - uses: actions/upload-artifact@v4
      with:
        name: Build Output
        path: ${{ steps.build.outputs.build-output }}
